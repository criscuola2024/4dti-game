<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>4DTI Click Game</title>
<style>
  body {
    font-family: sans-serif;
    text-align: center;
    margin-top: 30px;
  }

  #score {
    font-size: 24px;
    margin-bottom: 20px;
  }

  #box {
    width: 120px;
    height: 120px;
    background: #4caf50;
    color: white;
    font-size: 32px;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    position: absolute;
    top: 100px;
    left: 100px;
    border-radius: 12px;
    cursor: pointer;
    box-shadow: 0 0 10px rgba(0,0,0,0.3);
  }
</style>
</head>
<body>

<h1>Click 4DTI!</h1>
<div id="score">Punteggio: 0</div>
<div id="box">4DTI</div>

<script>
  const box = document.getElementById("box");
  const scoreEl = document.getElementById("score");
  let score = 0;

  function moveBox() {
    const x = Math.random() * (window.innerWidth - 150);
    const y = Math.random() * (window.innerHeight - 150);
    box.style.left = x + "px";
    box.style.top = y + "px";
  }

  box.addEventListener("click", () => {
    score++;
    scoreEl.textContent = "Punteggio: " + score;
    moveBox();
  });

  moveBox(); // posizione iniziale
</script>

</body>
</html>
